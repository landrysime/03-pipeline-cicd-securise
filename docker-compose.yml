# ============================================================
# Stack CI/CD locale — Projet 03 (pipeline DevSecOps)
#   - jenkins    : orchestrateur du pipeline (Jenkinsfile)
#   - sonarqube  : analyse statique (SAST) + quality gate
#   - db         : PostgreSQL pour SonarQube
# Trivy n'est PAS un service : il tourne en conteneur jetable dans le pipeline.
#
# Lancer :   docker compose up -d
# Jenkins  : http://localhost:8080     SonarQube : http://localhost:9000
# ============================================================
services:

  jenkins:
    build:
      context: ./ci/jenkins          # image Jenkins + Docker CLI + Trivy (voir ci/jenkins/Dockerfile)
    container_name: jenkins
    user: root                        # pour accéder au socket Docker (lab uniquement)
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock   # Docker-outside-of-Docker
    networks:
      - cicd

  sonarqube:
    image: sonarqube:10.4-community
    container_name: sonarqube
    depends_on:
      - db
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - cicd

  db:
    image: postgres:15-alpine
    container_name: sonar-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - cicd

networks:
  cicd:
    driver: bridge

volumes:
  jenkins_home:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql_data:
